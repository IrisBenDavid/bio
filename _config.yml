title: "Iris BenDavid-Hadar"
description: "Associate Professor, Faculty of Education, Bar-Ilan University — education finance policy, resource allocation, and equity."
theme: minima

minima:
  skin: classic

show_excerpts: false

header_pages:
  - bio.md
  - papers.md
  - policy.md
  - research-areas.md
  - lead.md
  - forum.md
  - connect.md
  - dearu.md
  - teaching.md
  - media.md

plugins:
  - jekyll-feed
  - jekyll-seo-tag

# Deliberately no `email:` key here — minima's theme renders it as a plain,
# scrapeable mailto: link in a hidden h-card block on every page. The real
# contact method is the click-to-reveal button on the Bio page instead.
