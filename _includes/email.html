<span class="email-link" data-user="Iris.hadar" data-domain="biu.ac.il">Iris.hadar [at] biu [dot] ac [dot] il</span>
<script>
(function () {
  document.querySelectorAll('.email-link').forEach(function (el) {
    var addr = el.getAttribute('data-user') + '@' + el.getAttribute('data-domain');
    var a = document.createElement('a');
    a.href = 'mailto:' + addr;
    a.textContent = addr;
    el.replaceWith(a);
  });
})();
</script>
