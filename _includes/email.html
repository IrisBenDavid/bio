<span class="email-link">Iris.hadar [at] biu [dot] ac [dot] il</span>
<button type="button" class="email-reveal-btn" data-user="Iris.hadar" data-domain="biu.ac.il">Email me</button>
<script>
(function () {
  document.querySelectorAll('.email-reveal-btn').forEach(function (btn) {
    btn.addEventListener('click', function () {
      var addr = btn.getAttribute('data-user') + '@' + btn.getAttribute('data-domain');
      window.location.href = 'mailto:' + addr;
    });
  });
})();
</script>
